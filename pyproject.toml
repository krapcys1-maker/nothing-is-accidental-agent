[project]
name = "nothing-is-accidental-agent"
version = "0.1.0"
description = "Semi-autonomous agent for the 'Nothing Is Accidental' Substack experiment (local-first)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Instalowane tylko, gdy realnie wołamy API (poza dry_run):
llm = ["anthropic>=0.40"]
# Warstwa przeglądarki (Etap 4+, jeszcze nieużywana):
browser = ["playwright>=1.44"]
# Panel (Etap 3):
ui = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
